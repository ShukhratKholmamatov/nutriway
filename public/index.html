<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NUTRIWAY — NATURFLEX COLLAGEN</title>
    <link rel="canonical" href="https://nutriway.uz/uz/" />
    <!-- Send visitors to their language. Russian browsers get /ru/, else /uz/. -->
    <script>
      (function () {
        var lang = (navigator.language || "uz").toLowerCase();
        var target = lang.indexOf("ru") === 0 ? "/ru/" : "/uz/";
        location.replace(target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/uz/" />
  </head>
  <body>
    <p>
      <a href="/uz/">O'zbekcha</a> · <a href="/ru/">Русский</a>
    </p>
  </body>
</html>
