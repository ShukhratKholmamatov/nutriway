name: Build for cPanel

# Produces a ready-to-upload, Linux-built standalone bundle.
# Run it from the GitHub "Actions" tab (Build for cPanel → Run workflow),
# or it runs automatically on every push to main.
# When it finishes, download the "nutriway-cpanel" artifact — that zip is
# exactly what you upload to cPanel.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Next's standalone output ships server.js + a minimal node_modules,
      # but static assets and /public must be copied in beside it.
      - name: Assemble deploy bundle
        run: |
          mkdir -p bundle
          cp -r .next/standalone/. bundle/
          mkdir -p bundle/.next
          cp -r .next/static bundle/.next/static
          cp -r public bundle/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nutriway-cpanel
          path: bundle
          retention-days: 30
